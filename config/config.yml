mqtt:
  enabled: true
  host: mqtt
  port: 1883
  user: frigate
  password: CHANGE_ME

model:
  model_type: yolo-generic
  width: 640
  height: 640
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
  path: /config/model_cache/yolov9-s-640.onnx
  labelmap_path: /labelmap/coco-80.txt

detectors:
  onnx:
    type: onnx

cameras:
  camera_1:
    ffmpeg:
      hwaccel_args: preset-nvidia-h264
      inputs:
        - path: rtsp://user:password@camera-ip:554/stream
          roles:
            - detect
            - record
    detect:
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
        - car

record:
  enabled: true
  retain:
    days: 3
    mode: motion

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  crop: true

version: 0.16-0

